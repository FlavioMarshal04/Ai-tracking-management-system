version: '3.8'

services:
  # PostgreSQL Database Container with Persistent Volume & Health Check
  postgres:
    image: postgres:16-alpine
    container_name: edupulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edupulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edupulse-network

  # Node.js + Express + Prisma Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupulse-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-edupulse}?schema=public
      JWT_SECRET: ${JWT_SECRET:-edupulse-super-secret-jwt-key-2026}
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-sample}
      AI_API_KEY: ${AI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 15
    volumes:
      - backend_uploads:/app/uploads
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edupulse-network

  # React + Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - edupulse-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  edupulse-network:
    driver: bridge
